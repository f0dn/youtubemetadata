[project]
name = "youtubemetadata"
version = "0.1.0"
description = "include proper song metadata in youtube music"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mutagen>=1.48.1",
    "pydantic>=2.14.3",
    "ruff>=0.17.1",
    "yt-dlp>=2026.10.26",
    "ytmusicapi>=1.12.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E9"]
